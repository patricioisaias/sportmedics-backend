server:
  port: 8082

spring:
  application:
    name: ms-member
  datasource:
    url: jdbc:mysql://localhost:3306/gym_member_db?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


sql:
    init:
      mode: always 

  jpa:
    hibernate:
      ddl-auto: update
    # 2. Agrega esto para que espere a que Hibernate cree la tabla ANTES de insertar los datos
    defer-datasource-initialization: true