spring:
  application:
    name: api-gateway
server:
  port: 8761

spring:
  application:
    name: serviceregistry

eureka:
  instance:
    hostname: localhost
  client:
    # No debe registrarse a sí mismo ni buscar otros en este nivel
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

logging:
  level:
    com.sportmedics: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

server:
  port: 8080

spring:
  application:
    name: apigateway
  cloud:
    gateway:
      # Habilita el descubrimiento automático por nombre de servicio en Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      # RUTAS ESPECÍFICAS (Cumplimiento de arquitectura)
      routes:
        - id: ms-auth
          uri: lb://ms-auth # lb = Load Balancer (busca en Eureka)
          predicates:
            - Path=/api/auth/**
        
        - id: ms-member
          uri: lb://ms-member
          predicates:
            - Path=/api/members/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.sportmedics: DEBUG

server:
  port: 8081

spring:
  application:
    name: ms-auth
  datasource:
    url: jdbc:h2:mem:authdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/